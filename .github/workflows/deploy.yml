name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/determined-tesla-5wgy3x]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: missio-co/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: missio-co

      - name: Build
        run: npm run build
        working-directory: missio-co

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: missio-co/build
